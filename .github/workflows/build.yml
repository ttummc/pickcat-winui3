name: build-extension

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

# Newly created repositories default the workflow token to read-only, which makes
# softprops/action-gh-release fail with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the extension
        run: npm run ext:build

      - name: Package
        run: |
          cd extension/dist
          zip -qr ../../PickCat-WinUI3-extension.zip .
          cd ../..
          ls -lh PickCat-WinUI3-extension.zip

      - name: Checksum
        run: |
          sha256sum PickCat-WinUI3-extension.zip | tee SHA256SUMS.txt
          wc -c PickCat-WinUI3-extension.zip >> SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PickCat-WinUI3-extension
          path: PickCat-WinUI3-extension.zip

      - name: Drop retired assets from this release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset "${GITHUB_REF_NAME}" install-windows.bat --yes || true

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PickCat-WinUI3-extension.zip
            SHA256SUMS.txt
          body_path: RELEASE_NOTES.md

  desktop:
    # The MSI embeds the extension bundle, so it has to be rebuilt on every release.
    # It cannot be produced on linux: the app is a win-x64 WinUI 3 binary and the
    # installer comes from WiX.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the extension
        run: npm run ext:build

      - name: Stage the bundle into the desktop app
        shell: pwsh
        run: |
          Copy-Item extension\dist\content.js desktop\PickCat.WinUI3\Assets\content.js -Force
          Copy-Item extension\dist\content.css desktop\PickCat.WinUI3\Assets\content.css -Force
          Get-ChildItem desktop\PickCat.WinUI3\Assets | Select-Object Name, Length

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add the WiX Util extension
        shell: pwsh
        run: wix extension add --global WixToolset.Util.wixext/5.0.2

      - name: Publish the desktop app
        shell: pwsh
        run: |
          dotnet publish desktop\PickCat.WinUI3\PickCat.WinUI3.csproj `
            -c Release -r win-x64 --self-contained -o desktop\publish
          if (-not (Test-Path desktop\publish\PickCatWinUI3.pri)) {
            throw "publish is missing PickCatWinUI3.pri - the app will crash at startup"
          }

      - name: Build the installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force desktop\dist | Out-Null
          wix build installer\PickCatWinUI3.wxs `
            -d PublishDir="$PWD\desktop\publish" `
            -d Version=$version `
            -ext WixToolset.Util.wixext/5.0.2 `
            -o "desktop\dist\PickCatWinUI3-Setup-$version.msi"
          Get-ChildItem desktop\dist

      - name: Package and checksum
        shell: pwsh
        run: |
          Push-Location extension\dist
          if (Test-Path ../../PickCat-WinUI3-extension.zip) { Remove-Item ../../PickCat-WinUI3-extension.zip -Force }
          Compress-Archive -Path * -DestinationPath ../../PickCat-WinUI3-extension.zip -CompressionLevel Optimal
          Pop-Location

          $lines = @()
          foreach ($file in @("PickCat-WinUI3-extension.zip") + (Get-ChildItem desktop\dist\*.msi | ForEach-Object { $_.FullName })) {
            $item = Get-Item $file
            $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($item.Name)"
          }
          $lines -join "`n" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Attach the desktop build to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PickCat-WinUI3-extension.zip
            desktop/dist/*.msi
            SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
