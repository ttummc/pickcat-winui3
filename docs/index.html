<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickCat WinUI 3</title>
<meta name="description" content="用 WinUI 3 控件从零重写的 PickCat 界面。Chrome / Edge 扩展。">
<meta property="og:title" content="PickCat WinUI 3">
<meta property="og:description" content="不是换皮，是重写整个窗口。">
<meta property="og:image" content="promo/pickcat-promo.png">
<meta name="theme-color" content="#141218">
<link rel="icon" href="store/icon-128.png">
<style>
  /* Material Design 3 · dark · one screen, no navigation */
  :root {
    color-scheme: dark;
    --primary: #ffb4ab;
    --on-primary: #690005;
    --surface: #141218;
    --surface-1: #1d1b20;
    --surface-3: #2b2930;
    --on-surface: #e6e0e9;
    --on-surface-variant: #cac4d0;
    --outline: #49454f;
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: var(--surface);
    color: var(--on-surface);
    font-family: 'Roboto', 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--primary); text-decoration: none; }

  /* one screen: two columns, everything visible */
  .stage {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 0.92fr) minmax(0, 1fr);
    align-items: center;
    gap: clamp(28px, 5vw, 80px);
    padding: clamp(24px, 4vw, 56px) clamp(24px, 5vw, 72px) clamp(64px, 8vw, 84px);
    max-width: 1320px;
    margin: 0 auto;
  }

  /* ---------- left: copy ---------- */
  .copy { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }

  .eyebrow {
    margin: 0 0 14px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--primary);
  }

  h1 {
    margin: 0 0 16px;
    font-size: clamp(30px, 4.2vw, 52px);
    line-height: 1.06;
    letter-spacing: -0.025em;
    font-weight: 400;
    text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--primary); }

  .sub {
    margin: 0 0 26px;
    max-width: 46ch;
    font-size: clamp(13px, 1.1vw, 15px);
    line-height: 1.6;
    color: var(--on-surface-variant);
  }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 22px;
    border: 0;
    border-radius: 20px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: box-shadow 150ms var(--ease), background 150ms var(--ease), transform 100ms var(--ease);
  }
  .btn:active { transform: scale(0.98); }
  .btn--filled { background: var(--primary); color: var(--on-primary); }
  .btn--filled:hover { box-shadow: 0 1px 3px #0006; }
  .btn--outlined { background: none; color: var(--primary); box-shadow: inset 0 0 0 1px var(--outline); }
  .btn--outlined:hover { background: #ffb4ab14; }
  .btn svg { width: 17px; height: 17px; fill: currentColor; }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    margin-top: 22px;
    font-size: 12.5px;
    color: var(--on-surface-variant);
  }
  .meta b { color: var(--on-surface); font-weight: 500; }

  /* ---------- right: stacked screenshot deck ---------- */
  .deck {
    position: relative;
    width: 100%;
    max-height: calc(100vh - 150px);
    aspect-ratio: 16 / 10;
    justify-self: end;
  }

  .layer {
    position: absolute;
    inset: 0;
    margin: 0;
    border-radius: 16px;
    overflow: hidden;
    background: var(--surface-1);
    border: 1px solid var(--outline);
    box-shadow: 0 18px 48px #00000080;
    transition:
      transform 380ms var(--ease),
      opacity 280ms var(--ease),
      box-shadow 380ms var(--ease);
    will-change: transform;
    cursor: pointer;
  }
  .layer img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }

  /* depth: each level behind is smaller, offset up-right and dimmed */
  .layer[data-depth='0'] { transform: translate3d(0, 0, 0) scale(1); z-index: 5; opacity: 1; }
  .layer[data-depth='1'] { transform: translate3d(26px, -26px, 0) scale(0.955); z-index: 4; opacity: 0.72; }
  .layer[data-depth='2'] { transform: translate3d(50px, -50px, 0) scale(0.91); z-index: 3; opacity: 0.42; }
  .layer[data-depth='3'] { transform: translate3d(72px, -72px, 0) scale(0.865); z-index: 2; opacity: 0.2; }

  .layer:hover { box-shadow: 0 24px 60px #000000a0; }

  .layer__label {
    position: absolute;
    left: 14px;
    bottom: 12px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 28px;
    padding: 0 12px;
    border-radius: 14px;
    background: #141218d9;
    color: var(--on-surface);
    font-size: 12px;
    font-weight: 500;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  .layer__label span { color: var(--on-surface-variant); font-weight: 400; }
  .layer[data-depth='0'] .layer__label { display: inline-flex; }
  .layer:not([data-depth='0']) .layer__label { display: none; }

  /* ---------- one-line install ---------- */
  .install {
    position: absolute;
    left: clamp(24px, 5vw, 72px);
    right: clamp(24px, 5vw, 72px);
    bottom: clamp(16px, 2.4vw, 26px);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--on-surface-variant);
    flex-wrap: wrap;
  }
  .install b { color: var(--on-surface); font-weight: 500; }
  .install code {
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--surface-3);
    font-family: 'Roboto Mono', Consolas, monospace;
    font-size: 11.5px;
    color: var(--on-surface);
  }
  .install .sep { opacity: 0.4; }

  @media (prefers-reduced-motion: reduce) {
    .layer, .btn { transition: none; }
  }

  @media (max-width: 900px) {
    html, body { overflow: auto; height: auto; }
    .stage {
      grid-template-columns: minmax(0, 1fr);
      padding-bottom: 24px;
    }
    .deck { aspect-ratio: 16 / 10; order: -1; }
    .install { position: static; margin-top: 20px; }
  }
</style>
</head>
<body>

<main class="stage">
  <section class="copy">
    <p class="eyebrow">非官方 · GPL-3.0</p>
    <h1>把 PickCat 重做成<em>一个应用</em></h1>
    <p class="sub">
      原站界面整个丢掉，按系统应用的逻辑重做。窗口、导航、右键菜单、Markdown 编辑器、
      消息提示都是真控件，不是套一层皮。
    </p>

    <div class="actions">
      <a class="btn btn--filled"
         href="https://github.com/ttummc/pickcat-winui3/releases/latest/download/PickCat-WinUI3-extension.zip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4L11 14.2V3zM5 19h14v2H5z"/></svg>
        下载扩展
      </a>
      <a class="btn btn--outlined" id="desktop" href="#" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h8v6H3V5zm10 0h8v6h-8V5zM3 13h8v6H3v-6zm10 0h8v6h-8v-6z"/></svg>
        桌面版
      </a>
      <a class="btn btn--outlined" href="https://github.com/ttummc/pickcat-winui3">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.4 9.4 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>
        源码
      </a>
    </div>

    <div class="meta">
      <span><b id="ver">v1.0.1</b></span>
      <span><b id="size">1.6 MB</b> · 解压即用</span>
      <span><b>14</b> 个页面</span>
      <span>Chrome / Edge</span>
      <span id="desktop-meta" hidden>Windows 10/11 x64 · <b id="msi-size"></b></span>
    </div>
  </section>

  <section class="deck" id="deck">
    <figure class="layer" data-depth="0">
      <img src="screenshots/site/home.png" alt="首页">
      <figcaption class="layer__label">首页 <span>推荐 / 最新</span></figcaption>
    </figure>
    <figure class="layer" data-depth="1">
      <img src="screenshots/site/topic.png" alt="帖子详情" loading="lazy">
      <figcaption class="layer__label">帖子详情 <span>楼层 · 点赞 · 举报</span></figcaption>
    </figure>
    <figure class="layer" data-depth="2">
      <img src="screenshots/site/profile.png" alt="个人主页" loading="lazy">
      <figcaption class="layer__label">个人主页 <span>资料卡 · 热力图</span></figcaption>
    </figure>
    <figure class="layer" data-depth="3">
      <img src="screenshots/site/works.png" alt="作品" loading="lazy">
      <figcaption class="layer__label">作品 <span>精选轮播</span></figcaption>
    </figure>
  </section>

  <div class="install">
    <b>安装</b>
    <span>解压到固定目录</span><span class="sep">→</span>
    <code>chrome://extensions</code><span class="sep">→</span>
    <span>开发者模式</span><span class="sep">→</span>
    <span>加载已解压的扩展程序</span>
    <span class="sep">·</span>
    <span>别放 <code>C:\Program Files</code></span>
    <span class="sep">·</span>
    <span>或装 <b>桌面版</b> MSI，免扩展</span>
  </div>
</main>

<script>
  // click a layer to bring it to the front; the deck rotates
  (function () {
    var layers = Array.prototype.slice.call(document.querySelectorAll('.layer'));

    layers.forEach(function (el) {
      el.addEventListener('click', function () {
        var order = layers
          .slice()
          .sort(function (a, b) { return Number(a.dataset.depth) - Number(b.dataset.depth); });
        var index = order.indexOf(el);
        if (index <= 0) return;
        var rotated = order.slice(index).concat(order.slice(0, index));
        layers.forEach(function (l) { l.dataset.depth = String(rotated.indexOf(l)); });
      });
    });
  })();

  // keep the version/size honest without a rebuild
  (function () {
    var ver = document.getElementById('ver');
    var size = document.getElementById('size');
    fetch('https://api.github.com/repos/ttummc/pickcat-winui3/releases/latest', {
      headers: { Accept: 'application/vnd.github+json' },
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.tag_name && ver) ver.textContent = d.tag_name;
        var a = (d.assets || []).filter(function (x) {
          return x.name === 'PickCat-WinUI3-extension.zip';
        })[0];
        if (a && a.size && size) size.textContent = (a.size / 1024 / 1024).toFixed(2) + ' MB';

        // The desktop installer only exists on releases produced by the Windows job,
        // so the button stays hidden until the asset is actually there.
        var msi = (d.assets || []).filter(function (x) {
          return /^PickCatWinUI3-Setup-.*\.msi$/i.test(x.name);
        })[0];
        if (msi) {
          var btn = document.getElementById('desktop');
          var meta = document.getElementById('desktop-meta');
          var msiSize = document.getElementById('msi-size');
          if (btn) {
            btn.href = msi.browser_download_url;
            btn.hidden = false;
          }
          if (meta) meta.hidden = false;
          if (msiSize && msi.size) msiSize.textContent = (msi.size / 1024 / 1024).toFixed(1) + ' MB';
        }
      })
      .catch(function () {});
  })();
</script>

</body>
</html>
